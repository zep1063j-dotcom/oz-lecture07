<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음료 자판기</title>
  <style>
    body {
      padding: 24px;
      font-family: system-ui, sans-serif;
    }
    #balance {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>음료 자판기</h1>
  <p>넣은 돈 <span id="balance"></span></p>
  <p>
    <button id="coin-500" type="button">500원 넣기</button>
    <button id="coin-1000" type="button">1000원 넣기</button>
  </p>
  <p>
    <button id="water" type="button">물 800원</button>
    <button id="juice" type="button">주스 1200원</button>
  </p>
  <p id="message"></p>
  <p><span id="today"></span> 판매 <span id="total"></span></p>

  <script src="vending.js"></script>
</body>
</html>
