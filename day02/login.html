<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>실습01 login 폼</title>
  </head>
  <body>
    <h1>로그인폼 실습</h1>
    <form action="/login" method="post">
      <label for="userid">아이디</label>
      <input type="text" id="userid" name="userid" required>
      
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" name="pw" required>
      
      <button>로그인</button>
    </form>
  </body>
</html>
