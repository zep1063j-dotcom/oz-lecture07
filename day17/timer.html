<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 01 — 플랭크 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>플랭크 타이머</h1>
    <p id="time" class="time">100</p>
    <div class="buttons">
      <button id="start-btn" type="button">시작</button>
      <button id="stop-btn" type="button">멈춤</button>
      <button id="reset-btn" type="button">처음부터</button>
    </div>
    <p id="msg" class="msg"></p>
  </main>

  <script src="timer.js"></script>
</body>
</html>
